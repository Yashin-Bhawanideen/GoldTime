name: Android tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find gradlew
        run: find . -name "gradlew*" -not -path "./.git/*"
      - name: List app folder
        run: ls -la GoldTime/GoldTimeCo/GoldTimeApp
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run unit tests
        working-directory: GoldTime/GoldTimeCo/GoldTimeApp
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest
