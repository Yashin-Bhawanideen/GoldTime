name: Android tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GoldTime/GoldTimeCo/GoldTimeApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: GoldTime/GoldTimeCo/GoldTimeApp
      - run: chmod +x ./gradlew
      - run: ./gradlew testDebugUnitTest
